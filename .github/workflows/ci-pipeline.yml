name: IntelliFlow CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-and-test:
    name: Build & Test Spring Boot Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests & Package
        working-directory: ./intelliflow-backend
        run: mvn clean test package -DskipTests=false

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: ./intelliflow-backend/target/surefire-reports/

  docker-image-build:
    name: Build Multi-Stage Docker Container Images
    needs: backend-build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Spring Boot Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./intelliflow-backend
          file: ./intelliflow-backend/Dockerfile
          push: false
          tags: intelliflow/intelliflow-backend:latest

      - name: Build AI Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile.ai
          push: false
          tags: intelliflow/intelliflow-ai-service:latest
